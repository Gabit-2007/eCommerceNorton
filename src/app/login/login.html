<div class="flex justify-center items-center w-full h-[70vh]">

    <div 
    class="flex flex-col md:w-[40%] bg-(--linen) 
    border-2 border-amber-900/50 rounded-xl p-4 
    shadow-2xl font-title">
        <h1> LOGIN</h1>
        <app-input
            label = 'Email'
            placeholder = 'usuario@email.com'
            type = 'email'
            name="txtEmail"
            [(ngModel)]="obj.email"
        ></app-input>

        <app-input
            label = 'Senha'
            placeholder = 'Senha@123'
            type = 'password'
            name="txtSenha"
            [(ngModel)]="obj.senha"
        ></app-input>
        @if (mensagem) {
            <p class="text-center text-sm text-red-700 mb-2">{{ mensagem }}</p>
        }
        <a href="/" (click)="fazerLogin($event)">
            <button class="bg-green-900 text-white py-2 px-10 rounded w-fit self-center">ENTRAR</button>
        </a>
        <p class="text-center mt-3">Não tem conta? <a href="cadastro">Crie uma agora!</a></p>
        <a class="text-sm text-center" href="email-senha">Esqueci a senha</a>
    </div>
</div>
