<div *ngIf="produto" class="flex flex-col md:flex-row justify-between items-center">
    <div class="flex-1 flex items-center justify-center p-2 rounded-2xl shadow-2xs">
        <img class="max-w-[50%] md:max-w-[60%]" src="{{ produto.codigo }}.jpg">
    </div>

    <div class="px-4">
        <h1>{{ produto.nome }}</h1>

        <p class="text-wrap">
            {{ produto.descritivo }}
        </p>

        <div class="flex-1" *ngIf="produto.valorPromo > 0">
            <p class="line-through text-sm text-gray-500">
            R$ {{ produto.valor }}
            </p>

            <p class="text-4xl font-bold">
                R$ {{ produto.valorPromo }}
            </p>
        </div>

        <div *ngIf="produto.valorPromo <= 0">
            <p>
            R$ {{ produto.valor }}
            </p>    
        </div>
        <button class="bg-green-300 border border-green-400 w-full rounded-xl text-green-600 p-2 md:text-xl 
        transition-colors ease-out duration-200
        hover:bg-green-700 hover:text-white" 
        *ngIf="produto.quantidade > 0"
        (click)="adicionarCarrinho(produto)"
        type="button"
        >Comprar</button>

        <button class="bg-gray-300 border border-gray-400 w-full rounded-xl text-gray-600 p-2 md:text-xl" 
        *ngIf="produto.quantidade <= 0"
        type="button"
        >Sem estoque no momento!</button>

        <button class="bg-pink-200 border border-pink-400 w-full rounded-xl text-pink-600 p-2 md:text-xl
        transition-colors ease-out duration-200
        hover:bg-pink-700 hover:text-white" 
        type="button"
        >Favoritar ❤︎︎</button>
    </div>

</div>
