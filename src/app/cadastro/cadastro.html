
<div class="container center">
    <div class="flex justify-center items-center w-full py-10">

    <div 
    class="flex flex-col md:w-[40%] bg-(--linen) 
    border-2 border-amber-900/50 rounded-xl p-4 
    shadow-2xl">
        <h1>CADASTRAR-SE</h1>
        <app-input
            label = 'Email'
            placeholder = 'usuario@email.com'
            type = 'email'
        ></app-input>

        <app-input
            label = 'Senha'
            placeholder = 'Senha@123'
            type = 'password'
        ></app-input>
        <app-input
            label = 'Confirme a senha'

            type = 'password'
        ></app-input>

            label = 'Data de nascimento'
            type = 'date'
        ></app-input>
        <button class="bg-green-900 text-white py-2 px-10 rounded w-fit self-center">Finalizar</button>
        <p class="text-center mt-3">Já tem conta? <a href="login">Faça login!</a></p>
    </div>
</div>
</div>
