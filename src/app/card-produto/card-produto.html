<div 
    animate.enter="card-enter"
    class="p-4 flex flex-col justify-center h-100 w-[90%] md:w-90 items-center bg-(--white) rounded-xl"
>
    <img src="{{produto.codigo}}.jpg" class="max-w-[90%]">
    
    <div class="card-title">{{produto.nome}}</div>
    <div class="card-body">
            <div class="flex-1 flex flex-row align-top" 
            *ngIf="produto.valorPromo > 0">
                <p class="line-through text-xs text-gray-500">
                R$ {{ produto.valor }}
                </p>

                <p class="text-lg font-bold">
                    R$ {{ produto.valorPromo }}
                </p>
            </div>

            <div 
            *ngIf="produto.valorPromo <= 0">
                <p class="text-lg font-bold">
                R$ {{ produto.valor }}
                </p>  
            </div>
    </div>
    <button class="bg-(--white) border border-blue-400 w-full rounded-xl text-blue-600 p-2 md:text-xl 
    transition-colors ease-out duration-200
    hover:bg-blue-500 hover:text-white"
    type='button'
    (click)="verDetalhe(produto.codigo)"
    >Ver mais</button>

    <button class="bg-green-300 border border-green-400 w-full rounded-xl text-green-600 p-2 md:text-xl 
    transition-colors ease-out duration-200
    hover:bg-green-700 hover:text-white" 
    type="button"
    *ngIf=" produto.quantidade > 0"
    (click)="adicionarCarrinho(produto)"
    >Comprar</button>
</div>
