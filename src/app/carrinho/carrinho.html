<div class="col content-center justify-items-center">
    <div class="card w-2xl text-center flex flex-row"
    *ngFor="let item of itens">
        <div *ngIf="getProduto(item.produto) as obj">
            <div class="card-title">{{obj.nome}}</div>
            <div class="card-body">
            {{obj.quantidade}} <br>
                R$ {{obj.valor}}
            </div>
        </div>
        </div>
</div>
