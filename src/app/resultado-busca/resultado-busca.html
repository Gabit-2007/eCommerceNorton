
@if (carregando) {
  <p class="p-5">Buscando produtos...</p>
} @else if (mensagem) {
  <p class="p-5">{{ mensagem }}</p>
} @else {
  <!-- mesmos cards do feed: "Ver mais" abre o detalhe e "Comprar" põe no carrinho -->
  <div class="w-full flex flex-wrap justify-center gap-3 mt-5 pb-5">
    @for (produto of lista; track produto.codigo) {
      <app-card-produto [produto]="produto" />
    }
  </div>
}
